<!DOCTYPE html>
<html>
<head>
  <title>Calculadora</title>
  <style>
    body {
      background: #1c1c1c;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }

    h1 {
      font-size: 20px;
    }

    #pantalla {
      width: 254px;
      background: #000;
      font-size: 40px;
      text-align: right;
      padding: 15px;
      margin: 0 0 10px 0;
      border-radius: 8px;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 65px);
      gap: 8px;
    }

    button {
      height: 65px;
      font-size: 22px;
      border: none;
      border-radius: 50%;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    .ancho {
      grid-column: span 2;
      border-radius: 32px;
    }
  </style>
</head>
<body>

  <h1>Mi calculadora</h1>

  <p id="pantalla">0</p>

  <div class="botones">
    <button onclick="borrar()">C</button>
    <button onclick="borrarUno()">&#8592;</button>
    <button onclick="elegirOperacion('/')">&divide;</button>
    <button onclick="elegirOperacion('*')">&times;</button>

    <button onclick="escribir('7')">7</button>
    <button onclick="escribir('8')">8</button>
    <button onclick="escribir('9')">9</button>
    <button onclick="elegirOperacion('-')">-</button>

    <button onclick="escribir('4')">4</button>
    <button onclick="escribir('5')">5</button>
    <button onclick="escribir('6')">6</button>
    <button onclick="elegirOperacion('+')">+</button>

    <button onclick="escribir('1')">1</button>
    <button onclick="escribir('2')">2</button>
    <button onclick="escribir('3')">3</button>
    <button onclick="elegirOperacion('%')">%</button>

    <button onclick="escribir('0')" class="ancho">0</button>
    <button onclick="calcular()" class="ancho">=</button>
  </div>

  <script>
    let primerNumero = 0;
    let operacion = "";

    function escribir(numero) {
      const pantalla = document.getElementById("pantalla");

      if (pantalla.textContent === "0") {
        pantalla.textContent = numero;
      } else {
        pantalla.textContent = pantalla.textContent + numero;
      }
    }

    function borrar() {
      document.getElementById("pantalla").textContent = "0";
    }

    function borrarUno() {
      const pantalla = document.getElementById("pantalla");
      const texto = pantalla.textContent;

      if (texto.length === 1) {
        pantalla.textContent = "0";
      } else {
        pantalla.textContent = texto.slice(0, -1);
      }
    }

    function elegirOperacion(op) {
      const pantalla = document.getElementById("pantalla");
      primerNumero = Number(pantalla.textContent);
      operacion = op;
      pantalla.textContent = "0";
    }

    function calcular() {
      const pantalla = document.getElementById("pantalla");
      const segundoNumero = Number(pantalla.textContent);
      let resultado = 0;

      if (operacion === "+") {
        resultado = primerNumero + segundoNumero;
      } else if (operacion === "-") {
        resultado = primerNumero - segundoNumero;
      } else if (operacion === "*") {
        resultado = primerNumero * segundoNumero;
      } else if (operacion === "/" && segundoNumero === 0) {
        resultado = "No se puede";
      } else if (operacion === "%") {
        resultado = (primerNumero / 100) * segundoNumero;
      } else if (operacion === "/") {
        resultado = primerNumero / segundoNumero;
      }

      pantalla.textContent = resultado;
    }
  </script>

</body>
</html>
